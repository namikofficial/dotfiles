# Minimal independent recovery session. Keep this free of generated includes,
# plugins, panels, wallpaper daemons, and optional startup scripts.
monitor = ,preferred,auto,1

env = XCURSOR_SIZE,24

input {
    kb_layout = us
    follow_mouse = 1
    touchpad {
        natural_scroll = true
    }
}

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2
    col.active_border = rgba(00e5ffff)
    col.inactive_border = rgba(303050cc)
}

decoration {
    rounding = 8
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}
misc {
    disable_hyprland_logo = false
}

$mainMod = SUPER
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, E, exec, kitty -e yazi
bind = $mainMod, Q, killactive
bind = $mainMod SHIFT, E, exit
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3

exec-once = kitty --title "Hyprland Recovery" -e /usr/bin/zsh -lic 'printf "Recovery session: Super+Shift+E exits.\nRun: workstationctl diagnose login\n"; exec zsh -l'
