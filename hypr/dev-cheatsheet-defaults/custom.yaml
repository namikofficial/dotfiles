category: Custom
slug: custom
entries:
  - key: TODO item
    description: add your own command in custom.yaml
    copy: edit ~/.config/dev-cheatsheet/custom.yaml
    source: ~/.config/dev-cheatsheet/custom.yaml
    tags: [daily]
  - key: Dev health
    description: run fast local developer readiness check
    copy: dev-health
    source: ~/Documents/code/dotfiles/setup/dev-health.sh
    tags: [daily]
  - key: Deep health
    description: run full workstation health log
    copy: dev-health --full
    source: ~/Documents/code/dotfiles/setup/dev-health.sh
  - key: Stale guard
    description: check for retired stack references in docs/scripts
    copy: dotfiles-stale-check
    source: ~/Documents/code/dotfiles/setup/check-stale-references.sh
  - key: Project profiles
    description: show known project paths and git state
    copy: project-profile status
    source: ~/Documents/code/dotfiles/setup/project-profile.sh
    tags: [daily]
  - key: Recover desktop
    description: open desktop recovery menu
    copy: ~/.config/hypr/scripts/desktop-recovery.sh
    source: ~/.config/hypr/scripts/desktop-recovery.sh
  - key: Reload
    description: reload theme, kitty, hyprland, panel, and caches
    copy: ~/.config/hypr/scripts/theme-pass.sh
    source: ~/.config/hypr/scripts/theme-pass.sh
  - key: Restart panel
    description: restore the preferred panel
    copy: ~/.config/hypr/scripts/panel-switch.sh show
    source: ~/.config/hypr/scripts/panel-switch.sh
  - key: AI helper shell
    description: generate shell command via helper
    copy: ~/.config/hypr/scripts/ai-helper.sh shell
    source: ~/.config/hypr/scripts/ai-helper.sh
  - key: Wallpaper picker
    description: choose wallpaper with rofi
    copy: ~/.config/hypr/scripts/set-wallpaper.sh --pick
    source: ~/.config/hypr/scripts/set-wallpaper.sh
