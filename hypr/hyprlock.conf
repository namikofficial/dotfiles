$lock_bg = rgb(080b12)
$lock_fg = rgb(edf7ff)
$lock_accent = rgb(00e5ff)
$lock_font = Onest
$lock_blur = 4
$lock_brightness = 0.68
$lock_vibrancy = 0.25
source = ~/.cache/hypr/theme-colors-hyprlock.conf
source = ~/.cache/hypr/lock-settings.generated.conf

background {
    monitor =
    path = ~/.cache/lock-wallpaper
    blur_passes = $lock_blur
    contrast = 0.96
    brightness = $lock_brightness
    vibrancy = $lock_vibrancy
}

label {
    monitor =
    text = cmd[update:60000] date +"%A · %d %B"
    color = $lock_fg
    font_family = $lock_font
    font_size = 20
    position = 0, -176
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    color = $lock_fg
    font_family = $lock_font
    font_size = 104
    position = 0, -82
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 58
    outline_thickness = 1
    dots_size = 0.22
    dots_spacing = 0.2
    dots_center = true
    outer_color = $lock_accent
    inner_color = $lock_bg
    font_color = $lock_fg
    fade_on_empty = true
    hide_input = true
    rounding = 16
    font_family = $lock_font
    font_size = 16
    placeholder_text = Password
    fail_text = $PAMFAIL
    position = 0, 76
    halign = center
    valign = center
}

label {
    monitor =
    text = LOCKED · NOXFLOW
    color = $lock_accent
    font_family = $lock_font
    font_size = 12
    position = 0, 130
    halign = center
    valign = center
}
