# Android SDK environment for the systemd user manager.
# Keep this file to KEY=value assignments only; shell logic belongs in
# android-env.sh, which is sourced by interactive shells.
ANDROID_HOME=${ANDROID_HOME:-$HOME/Android/Sdk}
ANDROID_SDK_ROOT=$ANDROID_HOME
JAVA_HOME=${JAVA_HOME:-/usr/lib/jvm/default}
PATH=$ANDROID_HOME/build-tools/37.0.0:$ANDROID_HOME/emulator:$ANDROID_HOME/platform-tools:$ANDROID_HOME/cmdline-tools/latest/bin:$PATH
