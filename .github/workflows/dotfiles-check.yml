name: dotfiles-check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y shellcheck shfmt

      - name: Collect changed shell files
        id: changed
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git fetch --no-tags --depth=1 origin "${{ github.base_ref }}"
            mapfile -t files < <(git diff --name-only "origin/${{ github.base_ref }}"...HEAD)
          elif [[ "${{ github.event.before }}" == "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin main 2>/dev/null || true
            if git rev-parse --verify origin/main >/dev/null 2>&1; then
              mapfile -t files < <(git diff --name-only origin/main...HEAD)
            else
              mapfile -t files < <(git diff-tree --no-commit-id --name-only -r HEAD)
            fi
          else
            mapfile -t files < <(git diff --name-only "${{ github.event.before }}" "${{ github.sha }}")
          fi

          filtered=()
          for file in "${files[@]}"; do
            case "$file" in
              setup/*.sh|system/*.sh|hypr/scripts/*.sh|hypr/scripts/*/*.sh)
                [[ -f "$file" ]] && filtered+=("$file")
                ;;
            esac
          done

          if ((${#filtered[@]} == 0)); then
            echo "has_files=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "has_files=true"
            echo "files<<EOF"
            printf '%s\n' "${filtered[@]}"
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Run shell checks
        if: steps.changed.outputs.has_files == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat >/tmp/dotfiles-shell-files.txt <<'GITFILES'
          ${{ steps.changed.outputs.files }}
          GITFILES
          mapfile -t files < /tmp/dotfiles-shell-files.txt
          ./setup/check-dotfiles.sh "${files[@]}"
