services:
  rag-mcpo:
    build:
      context: /home/namik/Documents/code/dotfiles
      dockerfile: configs/open-webui/rag-mcpo.Dockerfile
    image: local/rag-mcpo:dotfiles
    container_name: rag-mcpo
    restart: unless-stopped
    ports:
      - "8088:8000"
    command:
      [
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--api-key",
        "${MCPO_API_KEY}",
        "--",
        "/usr/local/bin/python",
        "-m",
        "rag.mcp_server"
      ]
    environment:
      RAG_HOME: /workspace/ai-rag
      PYTHONPATH: /workspace/dotfiles/system
      PYTHONUNBUFFERED: "1"
    volumes:
      - /home/namik/Documents/code/dotfiles:/workspace/dotfiles:ro
      - /home/namik/ai-rag:/workspace/ai-rag

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    depends_on:
      - rag-mcpo
    ports:
      - "3080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      WEBUI_AUTH: "true"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_API_BASE_URLS: ${OPENAI_API_BASE_URLS:-}
      DEFAULT_MODELS: ${DEFAULT_MODELS:-}
    volumes:
      - open-webui-data:/app/backend/data

volumes:
  open-webui-data:
