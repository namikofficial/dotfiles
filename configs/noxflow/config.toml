# NoxFlow daemon configuration
# Canonical source: dotfiles/configs/noxflow/config.toml
# Symlinked to ~/.config/noxflow/config.toml
#
# The daemon's schema lives in core/noxflow-config. A key the schema does
# not know is ignored when the file is loaded, so a key that reads as if it
# configures something but is not in the schema is dead weight. This file is
# checked against the schema by
# core/noxflow-config/tests/repository_config.rs.
#
# The named profile is resolved from ~/.config/noxflow/profiles/<name>.toml,
# which the bootstrap links from config/profiles/.

profile = "laptop"

[appearance]
profile = "material-expressive"
density = "comfortable"
radius = 14

[shell]
reduced_motion = false

[ai]
provider = "local"
endpoint = "http://127.0.0.1:8080/v1"
model = "qwen3-4b-local"

[brightness]
minimum = 1
step = 10
external_backend = "none"

[audio]
max_volume = 100

[media]
mpris_integration = true
artwork_cache_enabled = true
artwork_cache_dir = ""
artwork_cache_max_bytes = 52428800
artwork_cache_ttl = 3600
default_player = "spotify"

[network]
wifi_backend = "iwd"

[power]
profile = "balanced"

[providers]
hyprland = true
audio = true
bluetooth = true
media = true
