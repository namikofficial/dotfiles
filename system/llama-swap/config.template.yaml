# llama-swap chat/agent router.
# Model paths are rendered by llama-swap-manager from:
#   /home/namik/llama-models/chat
# Embedding GGUFs are intentionally not configured here; run the separate
# embedding-server-manager on port 8081.

healthCheckTimeout: 120
logRequests: true

models:
  qwen3-4b-local:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __QWEN3_MODEL__
      --ctx-size 8192
      __GPU_LAYERS_ARG__
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - local
      - qwen3-4b-local
      - qwen3-4b

  granite-agent:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __GRANITE_MODEL__
      --ctx-size 8192
      __GPU_LAYERS_ARG__
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - granite-agent
      - granite

  qwen3-coder-heavy:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __QWEN3_CODER_HEAVY_MODEL__
      --ctx-size 8192
      __GPU_LAYERS_ARG__
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - qwen3-coder-heavy
      - qwen3-coder-30b
