# llama-swap: one OpenAI-compatible endpoint, one model loaded at a time.
# Source: https://github.com/mostlygeek/llama-swap
# Template: use __LLAMA_SERVER__ and __MODEL_ROOT__ as placeholders.
# Live config: ~/.config/llama-swap/config.yaml (generated by llama-swap-manager)

healthCheckTimeout: 120
logRequests: true

models:
  qwen3-8b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/Qwen3-8B-Q4_K_M.gguf
      --ctx-size 32768
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - local
      - qwen3
      - qwen3-8b

  qwen-coder-7b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      --ctx-size 32768
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - qwen-coder
      - qwen-coder-7b

  gemma-3-4b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/google_gemma-3-4b-it-Q4_K_M.gguf
      --ctx-size 32768
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - gemma
      - gemma4
      - gemma-3-4b

  phi-4-mini:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/Phi-4-Mini-Instruct-Q4_K_M.gguf
      --ctx-size 16384
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - phi4
      - phi-4-mini

  deepseek-r1-7b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/DeepSeek-R1-Distill-Qwen-7B-Q4_K_M.gguf
      --ctx-size 32768
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - deepseek
      - deepseek-r1
      - r1-7b

  llama-3b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/Llama-3.2-3B-Instruct-Q4_K_M.gguf
      --ctx-size 65536
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - llama3b
      - llama-3b

  qwen3-4b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/Qwen_Qwen3-4B-Q4_K_M.gguf
      --ctx-size 65536
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - qwen3-4b
      - qwen4

  qwen3-router:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/Qwen_Qwen3-1.7B-Q5_K_M.gguf
      --ctx-size 65536
      --n-gpu-layers 99
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - router
      - qwen3-router
      - qwen3-1b

groups:
  /coding: [qwen-coder-7b, qwen3-8b]
  /fast: [gemma-3-4b, qwen3-4b, llama-3b]
  /reasoning: [deepseek-r1-7b, qwen3-8b]
  /router: [qwen3-router]
