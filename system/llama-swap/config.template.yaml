# llama-swap: one OpenAI-compatible endpoint, one model loaded at a time.
# Source: https://github.com/mostlygeek/llama-swap
# Template: use __LLAMA_SERVER__, __MODEL_ROOT__, and __GPU_LAYERS_ARG__ as placeholders.
# Live config: ~/.config/llama-swap/config.yaml (generated by llama-swap-manager)
# llama-swap v219 rejects the old groups list format. Keep groups omitted until
# a valid matrix-based grouping config is introduced.
# GPU placement defaults to llama.cpp auto-fit. Set LLAMA_N_GPU_LAYERS=N only
# when you deliberately want to force a fixed layer count.

healthCheckTimeout: 120
logRequests: true

models:
  qwen3-8b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/Qwen3-8B-Q4_K_M.gguf
      --ctx-size 32768
      __GPU_LAYERS_ARG__
      --threads 8
      --parallel 1
      --jinja
    aliases:
      - qwen3
      - qwen3-8b

  qwen-coder-7b:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __MODEL_ROOT__/qwen2.5-coder-7b-instruct-q4_k_m.gguf
      --ctx-size 32768
