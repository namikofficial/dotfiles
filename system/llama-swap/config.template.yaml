# llama-swap chat/agent router.
# Model paths are rendered by llama-swap-manager from:
#   /home/namik/llama-models/chat
# Embedding GGUFs are intentionally not configured here; run the separate
# embedding-server-manager on port 8081.

healthCheckTimeout: 120
logRequests: true

models:
  qwen3-4b-local:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __QWEN3_MODEL__
      --ctx-size 65536
      __GPU_LAYERS_ARG__
      --threads 10
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 512
      --ubatch-size 256
      --jinja
    aliases:
      - qwen3-4b-local
      - qwen3-4b
      - qwen3

  granite-agent:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __GRANITE_MODEL__
      --ctx-size 32768
      __GPU_LAYERS_ARG__
      --threads 10
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 512
      --ubatch-size 256
      --jinja
    aliases:
      - granite-agent
      - granite

  qwen35-4b-local:
    cmd: >
      __LLAMA_SERVER__
      --host 127.0.0.1
      --port ${PORT}
      --model __QWEN35_MODEL__
      --ctx-size 65536
      __GPU_LAYERS_ARG__
      --threads 10
      --parallel 1
      --flash-attn on
      --cache-type-k q4_0
      --cache-type-v q4_0
      --batch-size 512
      --ubatch-size 256
      --jinja
      --reasoning on
      --reasoning-budget -1
    aliases:
      - qwen35-4b-local
      - qwen3.5-4b
      - qwen35
