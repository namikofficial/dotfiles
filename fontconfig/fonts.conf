<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Desktop font roles. Linked to ~/.config/fontconfig/fonts.conf by
  setup/normalize-links.sh; fonts installed by setup/install-ui-fonts.sh.

  sans-serif  Onest - UI text (the NoxOrigin app's body face)
  monospace   JetBrainsMono Nerd Font - terminal, code and icon glyphs
  emoji       Noto Color Emoji

  Most shell Text items never set font.family, so they resolve the generic
  "sans-serif" family; this is what makes the whole desktop use one face.
  Each list falls back to the old defaults if a font is missing.
-->
<fontconfig>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer>
      <family>Onest</family>
      <family>Noto Sans</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer>
      <family>JetBrainsMono Nerd Font</family>
      <family>Noto Sans Mono</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>
</fontconfig>
