# NoxFlow tmux cockpit
# Prefix: Ctrl-Space. Keep this file self-contained: private/scripts is optional.

# ── Terminal and performance ────────────────────────────────────────────────
set -sg escape-time 0
set -g history-limit 100000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g default-shell "/usr/bin/zsh"
set -g default-command "/usr/bin/zsh -l"
# RGB = truecolor, usstyle = undercurl/coloured underlines (LSP diagnostics).
set -as terminal-features ",xterm-kitty:RGB:usstyle"
# Let kitty graphics (snacks.image, yazi previews) through to the terminal.
set -g allow-passthrough on
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",tmux-256color:extkeys"
set -g set-clipboard on

# ── Session ergonomics ──────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g mouse on
set -g repeat-time 500
set -g display-panes-time 3000
set -g display-time 3000
setw -g mode-keys vi

# ── Palette ─────────────────────────────────────────────────────────────────
# First-boot fallback. ~/.cache/hypr/theme-colors-tmux.conf (written by
# hypr/scripts/theme-sync.sh, sourced below) overrides these same @theme_*
# options with the wallpaper palette. Layout formats only ever read
# #{@theme_*}, so colours and layout have one owner each.
set -g @theme_surface_canvas "#151218"
set -g @theme_surface "#241F29"
set -g @theme_surface2 "#302A36"
set -g @theme_surface_float "#493A50"
set -g @theme_accent "#D6A083"
set -g @theme_on_accent "#2A1813"
set -g @theme_text "#F5EEE9"
set -g @theme_muted "#AFA2A1"
set -g @theme_success "#A9D3A7"
set -g @theme_warn "#E5C184"
set -g @theme_danger "#E5867F"
set -g @theme_outline "#4A3D49"
set -g status-style "bg=#151218,fg=#F5EEE9"
set -g window-status-style "fg=#AFA2A1,bg=#151218"
set -g window-status-current-style "fg=#F5EEE9,bg=#302A36,bold"
set -g window-status-activity-style "fg=#E5C184,bg=#151218"
set -g window-status-bell-style "fg=#E5867F,bg=#151218,bold"
set -g message-style "bg=#302A36,fg=#F5EEE9,bold"
set -g message-command-style "bg=#302A36,fg=#F5EEE9"
set -g pane-border-style "fg=#4A3D49"
set -g pane-active-border-style "fg=#D6A083"
set -g pane-border-lines heavy
set -g mode-style "bg=#493A50,fg=#F5EEE9,bold"
set -g clock-mode-colour "#D6A083"
set -g clock-mode-style 24

# ── Prefix: Ctrl-Space ─────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Windows and panes ───────────────────────────────────────────────────────
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g pane-border-status top
set -g pane-border-format " #[fg=#{@theme_accent}]#{pane_index}#[fg=#{@theme_muted}] · #{pane_current_command}#{?pane_active, #[fg=#{@theme_success}]◆,} "

bind r source-file ~/.tmux.conf \; display-message " NoxFlow tmux reloaded"
bind C-l refresh-client
bind Space next-layout
bind z resize-pane -Z
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind X confirm-before -p "Kill window? (y/n)" kill-window
bind q display-panes

bind -n M-h previous-window
bind -n M-l next-window
bind -r Tab next-window

# ── Cockpit popups ──────────────────────────────────────────────────────────
bind t display-popup -E -w 82% -h 82% -d "#{pane_current_path}" "zsh -l"
bind g display-popup -E -w 92% -h 92% -d "#{pane_current_path}" \
  "command -v lazygit >/dev/null && exec lazygit || { printf '\\n  lazygit is not installed.\\n'; printf '  Install: sudo pacman -S lazygit\\n'; read -r; }"
bind p display-popup -E -w 94% -h 88% -d "#{pane_current_path}" "~/.local/bin/tmux-project-cockpit '#{pane_current_path}'"
bind a display-popup -E -w 78% -h 82% -d "#{pane_current_path}" "~/.local/bin/tmux-actions '#{pane_current_path}'"
bind D display-popup -E -w 92% -h 88% -d "#{pane_current_path}" "~/.local/bin/tmux-diagnostics '#{pane_current_path}'"
bind ? display-popup -E -w 72% -h 92% "~/.local/bin/tmux-help"
bind s display-popup -E -w 64% -h 84% "~/.local/bin/tmux-sessions"

# Existing OpenCode plugin remains available at Prefix + O.
set -g @plugin 'CoderMungan/tmux-opencode'
set -g @opencode-key 'O'
set -g @opencode-popup-width '90%'
set -g @opencode-popup-height '80%'
set -g @opencode-max-sessions '50'
set -g @opencode-show-archived 'false'

# ── Copy mode and clipboard ─────────────────────────────────────────────────
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  "set -g @copy_command 'wl-copy'" \
  "if-shell 'command -v xclip >/dev/null 2>&1' \"set -g @copy_command 'xclip -in -selection clipboard'\" \"if-shell 'command -v pbcopy >/dev/null 2>&1' \\\"set -g @copy_command 'pbcopy'\\\" \\\"set -g @copy_command 'cat >/dev/null'\\\"\""

bind -n WheelUpPane if -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word
bind-key -T copy-mode-vi TripleClick1Pane send-keys -X select-line
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

set -g monitor-activity on
set -g visual-activity off

# ── Plugins ─────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @fzf-url-fzf-options '-p 60%,30% --border-label=" Open with FZF "'
set -g @open-S 'https://www.google.com/search?q='
# prefix F = thumbs (hint-copy); tmux-fzf also defaults to F, so move it.
set -g @thumbs-key F
set-environment -g TMUX_FZF_LAUNCH_KEY "C-f"
set -g @fzf-url-bind 'u'
set -g @fzf-url-open 'xdg-open'
# tmux-menus keeps its default trigger: prefix \
set -g @menus_location_x 'C'
set -g @menus_location_y 'C'
set -g @tnotify-sleep-duration '15'

# ── Status line ─────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-left-length 190
set -g status-right-length 180
# cpu/battery/continuum each fork per tick; 15s is plenty for a status bar.
set -g status-interval 15
# Session pill turns red while the prefix is armed, so you can see it.
set -g status-left "#[fg=#{@theme_on_accent},bg=#{?client_prefix,#{@theme_danger},#{@theme_accent}},bold]  #S #[default] "
set -g window-status-separator ""
set -g window-status-format "#[fg=#{@theme_muted}] #I #W#{?window_activity_flag,#[fg=#{@theme_warn}] •,}#{?window_bell_flag,#[fg=#{@theme_danger}] !,} "
set -g window-status-current-format "#[bg=#{@theme_surface2},fg=#{@theme_accent},bold]▎#I #[fg=#{@theme_text}]#W#{?window_zoomed_flag,#[fg=#{@theme_accent}] 󰊓,} #[default]"
set -g status-right "#{?client_prefix,#[fg=#{@theme_danger}#,bold]PREFIX  ,}#[fg=#{@theme_muted}#,nobold]#{cpu_percentage}  #{battery_icon} #{battery_percentage}  %a %d %b  #[fg=#{@theme_text}#,bold]%H:%M#[fg=#{@theme_muted}#,nobold]   ? help "

# Wallpaper-derived colors are generated from the canonical nox-theme JSON.
# Keep the static values above as a first-boot fallback; this include is the
# authoritative runtime override after a theme pass.
if-shell '[ -f ~/.cache/hypr/theme-colors-tmux.conf ]' \
  'source-file ~/.cache/hypr/theme-colors-tmux.conf'

# ── TPM (keep last) ─────────────────────────────────────────────────────────
if-shell '[ -d ~/.tmux/plugins/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
