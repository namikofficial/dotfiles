# NoxFlow tmux cockpit
# Prefix: Ctrl-Space. Keep this file self-contained: private/scripts is optional.

# ── Terminal and performance ────────────────────────────────────────────────
set -sg escape-time 0
set -g history-limit 100000
set -g focus-events on
set -g default-terminal "tmux-256color"
set -g default-shell "/usr/bin/zsh"
set -g default-command "/usr/bin/zsh -l"
set -as terminal-features ",xterm-kitty:RGB"
set -ga terminal-overrides ",xterm-kitty:Tc"
set -s extended-keys on
set -s extended-keys-format csi-u
set -as terminal-features ",tmux-256color:extkeys"
set -g set-clipboard on

# ── Session ergonomics ──────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g detach-on-destroy off
set -g mouse on
set -g repeat-time 500
set -g display-panes-time 3000
set -g display-time 3000
setw -g mode-keys vi

# ── NoxFlow Material palette ────────────────────────────────────────────────
set -g status-style "bg=#151218,fg=#F5EEE9"
set -g message-style "bg=#302A36,fg=#F5EEE9,bold"
set -g message-command-style "bg=#302A36,fg=#F5EEE9"
set -g pane-border-style "fg=#4A3D49"
set -g pane-active-border-style "fg=#D6A083"
set -g pane-border-lines heavy
set -g mode-style "bg=#493A50,fg=#F5EEE9,bold"
set -g clock-mode-colour "#D6A083"
set -g clock-mode-style 24

# ── Prefix: Ctrl-Space ─────────────────────────────────────────────────────
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# ── Windows and panes ───────────────────────────────────────────────────────
unbind '"'
unbind %
bind - split-window -v -c "#{pane_current_path}"
bind | split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

set -g pane-border-status top
set -g pane-border-format " #[fg=#D6A083]#{pane_index}#[fg=#AFA2A1] · #{pane_current_command}#{?pane_active, #[fg=#A9D3A7]◆,} "

bind r source-file ~/.tmux.conf \; display-message " NoxFlow tmux reloaded"
bind C-l refresh-client
bind Space next-layout
bind z resize-pane -Z
bind x confirm-before -p "Kill pane? (y/n)" kill-pane
bind X confirm-before -p "Kill window? (y/n)" kill-window
bind q display-panes

bind -n M-h previous-window
bind -n M-l next-window
bind -r Tab next-window

# ── Cockpit popups ──────────────────────────────────────────────────────────
bind t display-popup -E -w 82% -h 82% -d "#{pane_current_path}" "zsh -l"
bind g display-popup -E -w 92% -h 92% -d "#{pane_current_path}" \
  "command -v lazygit >/dev/null && exec lazygit || { printf '\\n  lazygit is not installed.\\n'; printf '  Install: sudo pacman -S lazygit\\n'; read -r; }"
bind p display-popup -E -w 94% -h 88% -d "#{pane_current_path}" "~/.local/bin/tmux-project-cockpit '#{pane_current_path}'"
bind a display-popup -E -w 78% -h 82% -d "#{pane_current_path}" "~/.local/bin/tmux-actions '#{pane_current_path}'"
bind D display-popup -E -w 92% -h 88% -d "#{pane_current_path}" "~/.local/bin/tmux-diagnostics '#{pane_current_path}'"
bind ? display-popup -E -w 72% -h 92% "~/.local/bin/tmux-help"
bind s display-popup -E -w 64% -h 84% "~/.local/bin/tmux-sessions"

# Existing OpenCode plugin remains available at Prefix + O.
set -g @plugin 'CoderMungan/tmux-opencode'
set -g @opencode-key 'O'
set -g @opencode-popup-width '90%'
set -g @opencode-popup-height '80%'
set -g @opencode-max-sessions '50'
set -g @opencode-show-archived 'false'

# ── Copy mode and clipboard ─────────────────────────────────────────────────
if-shell 'command -v wl-copy >/dev/null 2>&1' \
  "set -g @copy_command 'wl-copy'" \
  "if-shell 'command -v xclip >/dev/null 2>&1' \"set -g @copy_command 'xclip -in -selection clipboard'\" \"if-shell 'command -v pbcopy >/dev/null 2>&1' \\\"set -g @copy_command 'pbcopy'\\\" \\\"set -g @copy_command 'cat >/dev/null'\\\"\""

bind -n WheelUpPane if -F "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e'"
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi DoubleClick1Pane send-keys -X select-word
bind-key -T copy-mode-vi TripleClick1Pane send-keys -X select-line
bind-key -T copy-mode y send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode Enter send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "#{@copy_command}"
bind-key -T copy-mode-vi WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode-vi WheelDownPane send-keys -X scroll-down
bind-key -T copy-mode WheelUpPane send-keys -X scroll-up
bind-key -T copy-mode WheelDownPane send-keys -X scroll-down

set -g monitor-activity on
set -g visual-activity off

# ── Plugins ─────────────────────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'sainnhe/tmux-fzf'
set -g @plugin 'tmux-plugins/tmux-open'
set -g @plugin 'fcsonline/tmux-thumbs'
set -g @plugin 'wfxr/tmux-fzf-url'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'rickstaa/tmux-notify'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'

set -g @resurrect-capture-pane-contents 'on'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'
set -g @fzf-url-fzf-options '-p 60%,30% --border-label=" Open with FZF "'
set -g @open-S 'https://www.google.com/search?q='
set -g @thumbs-key F
set -g @fzf-url-bind 'u'
set -g @fzf-url-open 'xdg-open'
set -g @menus_trigger '\\'
set -g @menus_location_x 'C'
set -g @menus_location_y 'C'
set -g @tnotify-sleep-duration '15'

# ── Status line ─────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-justify left
set -g status-left-length 190
set -g status-right-length 180
set -g status-interval 5
set -g status-left "#[fg=#151218,bg=#D6A083,bold]  #S #[fg=#D6A083,bg=#241F29]#[fg=#F5EEE9,bg=#241F29]  ? help · s sessions · p projects · a actions · t scratch · D diagnostics #[fg=#241F29,bg=#151218]"
set -g window-status-separator "  "
set -g window-status-style "fg=#AFA2A1,bg=#151218"
set -g window-status-format "#[fg=#4A3D49]#{window_index} #[fg=#AFA2A1]#W#{?window_activity_flag,#[fg=#E5C184] •,}"
set -g window-status-current-style "fg=#2A1813,bg=#D6A083,bold"
set -g window-status-current-format "#[fg=#D6A083,bg=#151218]#[fg=#2A1813,bg=#D6A083,bold] #{window_index} #W#{?window_zoomed_flag, ⛶,} #[fg=#D6A083,bg=#151218]"
set -g status-right "#[fg=#A9D3A7]CPU #{cpu_percentage}#[fg=#AFA2A1] · #[fg=#9DB9A6]BAT #{battery_icon} #{battery_percentage}#[fg=#AFA2A1] · #[fg=#B7A3C7]%a %d %b %H:%M "

# ── TPM (keep last) ─────────────────────────────────────────────────────────
if-shell '[ -d ~/.tmux/plugins/tpm ]' 'run-shell ~/.tmux/plugins/tpm/tpm'
