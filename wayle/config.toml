# ─────────────────────────────────────────────────────────────────────────────
# ⚠ DEPRECATED — Wayle bar configuration.
# NoxFlow (Quickshell) is the active shell. This file is kept as a reference
# fallback and for the noxflow-fallback systemd unit.
# Active shell config: ~/.config/noxflow/config.toml and shell/noxflow/
# ─────────────────────────────────────────────────────────────────────────────

imports = []

[general]
font-sans = "Inter"
font-mono = "JetBrains Mono"
tearing-mode = false

[bar]
scale = 0.84
inset-edge = 0.21
inset-ends = 0.22
padding = 0.18
padding-ends = 0.24
module-gap = 0.48
location = "top"
bg = "transparent"
background-opacity = 0
border-location = "none"
border-width = 1
border-color = "border-accent"
rounding = "none"
shadow = "none"
button-variant = "basic"
button-icon-size = 0.94
button-icon-padding = 0.96
button-label-size = 0.95
button-label-weight = "medium"
button-label-padding = 0.92
button-gap = 0.82
button-rounding = "sm"
button-group-background = "bg-surface-elevated"
button-group-rounding = "md"
button-group-module-gap = 0.34
button-group-padding = 0.20
button-group-border-location = "all"
button-group-border-width = 1
button-group-border-color = "border-subtle"
button-bg-opacity = 0
dropdown-shadow = true
dropdown-opacity = 98
dropdown-autohide = true
dropdown-freeze-label = true

[[bar.layout]]
monitor = "*"
show = true
left = [
  { name = "workspaces", modules = ["hyprland-workspaces"] },
  { name = "layout", modules = ["custom-layout"] },
  { name = "sys", modules = ["custom-updates"] },
  { name = "window", modules = ["window-title"] },
]
center = [
  { name = "center-clock", modules = ["clock"] },
]
right = [
  { name = "controls", modules = ["custom-brightness", "volume", "custom-syncthing", "custom-logs"] },
  { name = "status", modules = ["battery", "bluetooth", "network"] },
  { name = "work", modules = ["custom-work-project", "custom-work-git", "custom-work-task", "custom-work-ai"] },
  { name = "alerts", modules = ["notifications"] },
]

[styling]
scale = 0.92
rounding = "sm"
theme-provider = "wayle"
theming-monitor = ""

[styling.palette]
bg = "#080b12"
surface = "#111522"
elevated = "#191f31"
fg = "#edf7ff"
fg-muted = "#9aa9bd"
primary = "#00e5ff"
red = "#ff3c78"
yellow = "#ffd166"
green = "#59ffa1"
blue = "#7c6cff"

[modules.hyprland-workspaces]
monitor-specific = true
show-special = true
display-mode = "label"
label-use-name = false
numbering = "absolute"
active-indicator = "background"
active-color = "accent"
occupied-color = "fg-muted"
empty-color = "fg-subtle"
workspace-padding = 0.72
icon-size = 0.95
label-size = 0.95
container-bg-color = "transparent"

[modules.window-title]
format = "{{ title }}"
label-max-length = 28

[modules.media]
format = "{{ title }}"
label-max-length = 24
left-click = "$HOME/.config/hypr/scripts/media-control.sh play-pause"
right-click = "$HOME/.config/hypr/scripts/media-control.sh next"

[modules.clock]
format = "%a %d %b %H:%M"
left-click = "dropdown:calendar"
dropdown-show-seconds = false

[modules.network]
label-show = false
icon-bg-color = "auto"
button-bg-color = "transparent"

[modules.volume]
label-show = true
label-max-length = 5
scroll-up = "wayle audio output-volume +3"
scroll-down = "wayle audio output-volume -3"
icon-bg-color = "auto"
label-color = "fg-default"
button-bg-color = "transparent"

[modules.bluetooth]
label-show = true
label-max-length = 14
icon-bg-color = "auto"
label-color = "fg-default"
button-bg-color = "transparent"

[modules.notifications]
left-click = "dropdown:notification"
right-click = "wayle notify dnd"
popup-position = "top-right"
popup-max-visible = 5
popup-duration = 5000
icon-bg-color = "auto"
label-color = "fg-default"
button-bg-color = "transparent"

[[modules.custom]]
id = "updates"
command = '''$HOME/.config/hypr/scripts/status-updates.sh'''
mode = "poll"
interval-ms = 60000
format = "UP {{ text }}"
icon-show = false
label-show = true
label-max-length = 8
button-bg-color = "transparent"
icon-bg-color = "auto"
label-color = "fg-default"
border-show = true
border-color = "border-subtle"
left-click = "kitty -e sh -lc '$HOME/.config/hypr/scripts/system-update.sh run; read -r -p \"Press enter to close\"'"
right-click = "kitty -e sh -lc '$HOME/.config/hypr/scripts/system-update.sh run; read -r -p \"Press enter to close\"'"
on-action = '''$HOME/.config/hypr/scripts/status-updates.sh'''

[[modules.custom]]
id = "layout"
command = "$HOME/.config/hypr/scripts/layout-switcher.sh status"
mode = "poll"
interval-ms = 600
format = "{{ text }}"
icon-name = "ld-layout-grid-symbolic"
label-show = true
label-max-length = 12
button-bg-color = "bg-surface-elevated"
icon-bg-color = "auto"
label-color = "fg-default"
left-click = "$HOME/.config/hypr/scripts/layout-switcher.sh cycle"
right-click = "$HOME/.config/hypr/scripts/layout-switcher.sh toggle"
on-action = "$HOME/.config/hypr/scripts/layout-switcher.sh status"

[[modules.custom]]
id = "brightness"
command = '''brightnessctl -m | awk -F',' '{gsub(/%/, "", $4); p=$4+0; printf("{\"percentage\":%d,\"text\":\"%d%%\"}\n", p, p)}' '''
mode = "poll"
interval-ms = 1500
format = "☀ {{ text }}"
icon-show = false
label-show = true
label-max-length = 8
button-bg-color = "transparent"
icon-bg-color = "auto"
label-color = "fg-default"
left-click = "$HOME/.config/hypr/scripts/brightness-control.sh menu"
right-click = "brightnessctl set 55%"
scroll-up = "brightnessctl set +4%"
scroll-down = "brightnessctl set 4%-"
on-action = '''brightnessctl -m | awk -F',' '{gsub(/%/, "", $4); p=$4+0; printf("{\"percentage\":%d,\"text\":\"%d%%\"}\n", p, p)}' '''

[[modules.custom]]
id = "logs"
command = '''printf('{"text":"LOG","tooltip":"Open context-aware project logs"}\n')'''
mode = "poll"
interval-ms = 10000
format = "LOG"
icon-show = false
label-show = true
label-max-length = 4
button-bg-color = "transparent"
icon-bg-color = "auto"
label-color = "fg-default"
left-click = "$HOME/.config/hypr/scripts/scratchpad-manager.sh launch logs"

[[modules.custom]]
id = "syncthing"
command = '''$HOME/.config/hypr/scripts/syncthing-status.sh'''
mode = "poll"
interval-ms = 5000
format = "SYNC {{ text }}"
icon-show = true
icon-name = "folder-sync-symbolic"
label-show = true
label-max-length = 8
button-bg-color = "transparent"
icon-bg-color = "auto"
label-color = "fg-default"
left-click = "$HOME/.config/hypr/scripts/syncthing-control.sh open-ui"
right-click = "$HOME/.config/hypr/scripts/syncthing-control.sh menu"
on-action = '''$HOME/.config/hypr/scripts/syncthing-status.sh'''

[[modules.custom]]
id = "quick"
command = '''printf('{"text":"⚡"}\n')'''
mode = "poll"
interval-ms = 3600000
format = "{{ text }}"
icon-show = false
label-show = true
label-max-length = 3
button-bg-color = "transparent"
icon-bg-color = "auto"
label-color = "fg-default"
left-click = "$HOME/.config/hypr/scripts/quick-actions.sh"

[[modules.custom]]
id = "work-project"
command = "$HOME/.config/hypr/scripts/workbench-wayle-status project"
mode = "poll"
interval-ms = 5000
format = "{{ text }}"
icon-show = false
label-show = true
label-max-length = 20
button-bg-color = "bg-surface-elevated"
icon-bg-color = "auto"
label-color = "fg-default"
left-click = "$HOME/.config/hypr/scripts/kage-project-rofi.sh"
right-click = "$HOME/.config/hypr/scripts/workbench-project-switcher"

[[modules.custom]]
id = "work-git"
command = "$HOME/.config/hypr/scripts/workbench-wayle-status git"
mode = "poll"
interval-ms = 5000
format = "{{ text }}"
icon-show = false
label-show = true
label-max-length = 24
button-bg-color = "bg-surface-elevated"
icon-bg-color = "auto"
label-color = "fg-muted"
left-click = "$HOME/.config/hypr/scripts/kage-project-rofi.sh"

[[modules.custom]]
id = "work-task"
command = "$HOME/.config/hypr/scripts/workbench-wayle-status work"
mode = "poll"
interval-ms = 5000
format = "{{ text }}"
icon-show = false
label-show = true
label-max-length = 28
button-bg-color = "bg-surface-elevated"
icon-bg-color = "auto"
label-color = "fg-default"
left-click = "$HOME/.config/hypr/scripts/open-ai-workbench.sh work"

[[modules.custom]]
id = "work-ai"
command = "$HOME/.config/hypr/scripts/workbench-wayle-status ai"
mode = "poll"
interval-ms = 5000
format = "{{ text }}"
icon-show = false
label-show = true
label-max-length = 14
button-bg-color = "bg-surface-elevated"
icon-bg-color = "auto"
label-color = "fg-muted"
left-click = "$HOME/.config/hypr/scripts/scratchpad-manager.sh launch ai"
right-click = "$HOME/.config/hypr/scripts/open-ai-workbench.sh ask"

[modules.battery]
left-click = "dropdown:battery"
icon-bg-color = "auto"
label-color = "fg-default"
button-bg-color = "transparent"

[modules.dashboard]
left-click = "dropdown:dashboard"
dropdown-lock-command = "loginctl lock-session"
dropdown-logout-command = "loginctl terminate-session $XDG_SESSION_ID"
dropdown-reboot-command = "systemctl reboot"
dropdown-poweroff-command = "systemctl poweroff"

[osd]
enabled = false

[wallpaper]
engine-enabled = false
