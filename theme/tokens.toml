# NoxFlow Material design tokens.
# Run `python3 setup/generate-material-tokens.py` after changing this file.

[meta]
schema = 1
name = "noxflow-material"

[appearance]
mode = "dark"
density = "comfortable"
radius = 14
motion = "fluid"
transparency = "balanced"

[tonal]
background = "#090B10"
primary = "#8FA8FF"
on_primary = "#101A3A"
primary_container = "#293A75"
on_primary_container = "#DCE3FF"
secondary = "#7CE0D3"
on_secondary = "#08201D"
secondary_container = "#20504A"
on_secondary_container = "#B8F3EA"
tertiary = "#D4B6F2"
on_tertiary = "#261334"
tertiary_container = "#503A68"
on_tertiary_container = "#EFDFFF"

[surface]
surface = "#11141C"
surface_container_low = "#0E1117"
surface_container = "#181C27"
surface_container_high = "#222838"
surface_container_highest = "#2C3344"
surface_variant = "#303749"
inverse_surface = "#E1E5EF"
inverse_on_surface = "#282B33"

[text]
primary = "#F2F5FA"
secondary = "#D7DEEA"
muted = "#9EA8B8"
disabled = "#687181"
on_primary = "#101A3A"
on_secondary = "#08201D"
on_surface_variant = "#C0C8D8"

[outline]
default = "#596276"
subtle = "#303749"
strong = "#AAB5C9"
focus = "#B8C7FF"

[state]
success = "#7ADFA4"
on_success = "#092616"
warning = "#F2C66D"
on_warning = "#2B2107"
danger = "#FF7993"
on_danger = "#3A0713"
info = "#8DC9FF"
on_info = "#08233A"
hover_overlay = "#FFFFFF"
pressed_overlay = "#000000"
focus_overlay = "#B8C7FF"
disabled_overlay = "#FFFFFF"

[spacing]
none = 0
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
xxl = 32
section = 40

[radius]
none = 0
xs = 4
sm = 8
md = 12
lg = 16
xl = 24
pill = 999

[elevation]
none = 0
low = 1
medium = 3
high = 6
overlay = 12

[typography]
font_family = "Inter"
display_large = 36
display_medium = 28
headline_large = 24
headline_medium = 20
title_large = 18
title_medium = 16
body_large = 16
body_medium = 14
body_small = 12
label_large = 14
label_medium = 12
label_small = 11

[icon]
xs = 16
sm = 20
md = 24
lg = 32
xl = 48

[duration]
instant = 0
short = 100
medium = 200
long = 350
emphasized = 500

[easing]
standard = "cubic-bezier(0.2, 0.0, 0.0, 1.0)"
emphasized = "cubic-bezier(0.2, 0.0, 0.0, 1.0)"
decelerated = "cubic-bezier(0.0, 0.0, 0.2, 1.0)"
accelerated = "cubic-bezier(0.3, 0.0, 1.0, 1.0)"

[opacity]
disabled = 0.38
scrim = 0.60
medium = 0.72
subtle = 0.80
full = 1.0

[blur]
none = 0
subtle = 8
medium = 16
strong = 28

[height]
icon_button = 40
button = 40
control = 44
field = 48
chip = 32
toolbar = 56

[reduced_motion]
enabled = false
duration_scale = 0.0
disable_blur = true
disable_scale = true
