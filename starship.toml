add_newline = true
command_timeout = 1200
palette = "cosmic_emerald"

format = """
[](fg:accent)[ ⚡ ](bg:accent fg:bg bold)[](fg:accent)\
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$fill\
$nodejs\
$python\
$golang\
$rust\
$java\
$docker_context\
$cmd_duration\
$line_break\
$character"""

[palettes.cosmic_emerald]
accent = "#7fbf9f"
bg = "#0f1318"
surface = "#1a212b"
text = "#d7dde5"
muted = "#87919d"

[os]
disabled = true

[username]
show_always = true
style_user = "fg:text bold"
style_root = "fg:accent bold"
format = "[ $user ]($style)"

[hostname]
ssh_only = false
style = "fg:muted"
format = "[@$hostname ]($style)"

[directory]
truncation_length = 4
truncation_symbol = "…/"
style = "fg:accent bold"
format = "[in $path ]($style)"
read_only = " ro"

[git_branch]
symbol = ""
style = "fg:text"
format = "[on $symbol $branch ]($style)"

[git_status]
style = "fg:accent"
format = "[$all_status$ahead_behind ]($style)"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕${ahead_count}/${behind_count}"
untracked = "?${count}"
stashed = "*${count}"
modified = "~${count}"
staged = "+${count}"
renamed = "»${count}"
deleted = "-${count}"

[fill]
symbol = " "

[nodejs]
symbol = ""
style = "fg:muted"
format = "[ $symbol $version ]($style)"

[python]
symbol = ""
style = "fg:muted"
format = "[ $symbol $version ]($style)"

[golang]
symbol = ""
style = "fg:muted"
format = "[ $symbol $version ]($style)"

[rust]
symbol = ""
style = "fg:muted"
format = "[ $symbol $version ]($style)"

[java]
symbol = ""
style = "fg:muted"
format = "[ $symbol $version ]($style)"

[docker_context]
symbol = ""
style = "fg:muted"
format = "[ $symbol $context ]($style)"

[cmd_duration]
min_time = 400
style = "fg:muted"
format = "[took $duration ]($style)"

[character]
success_symbol = "[❯](bold fg:accent)"
error_symbol = "[❯](bold fg:accent)"
vimcmd_symbol = "[❮](bold fg:accent)"
