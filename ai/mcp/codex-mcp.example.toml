# Example Codex MCP config
# Copy the servers you want into your Codex MCP config and replace placeholders.

[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/home/namik/Documents"]
enabled = true

[mcp_servers.git]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-git", "--repository", "/home/namik/Documents/code/dotfiles"]
enabled = true

[mcp_servers.sqlite]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-sqlite", "--db-path", "/home/namik/.local/share/rag/rag.db"]
enabled = true

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
enabled = true

[mcp_servers.rag]
command = "rag-mcp"
args = []
enabled = true

[mcp_servers.local-docs]
command = "bash"
args = ["/home/namik/Documents/code/dotfiles/system/local-docs-mcp.sh"]
enabled = true

[mcp_servers.browser]
command = "/home/namik/.local/share/opencode/mcp/node_modules/.bin/playwright-mcp"
args = ["--browser", "chromium", "--viewport-size", "1920x1080", "--output-dir", "/home/namik/.cache/codex/playwright-mcp"]
enabled = true

[mcp_servers.chrome-devtools]
command = "/home/namik/.local/share/opencode/mcp/node_modules/.bin/chrome-devtools-mcp"
args = []
enabled = true

[mcp_servers.postgres]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-postgres", "postgresql://user:password@localhost/dbname"]
enabled = false
